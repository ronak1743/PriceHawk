spring.application.name=pricehawk-backend
server.port=${PORT:8080}

# Supabase PostgreSQL Configuration (Loaded strictly from .env / environment variables)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# HikariCP Connection Pool Settings for Supabase
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000

# JWT Configuration (minimum 256 bits for HS256)
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Brevo Email Configuration (No custom domain required - free tier 300 emails/day)
brevo.api.key=${BREVO_API_KEY:}
brevo.sender.email=${BREVO_SENDER_EMAIL:ronakg036@gmail.com}
brevo.sender.name=${BREVO_SENDER_NAME:PriceHawk}

# Resend Email Configuration (Alternative / Fallback)
resend.api.key=${RESEND_API_KEY:}
resend.from.email=${RESEND_FROM_EMAIL:PriceHawk <onboarding@resend.dev>}
resend.override.recipient=${RESEND_OVERRIDE_RECIPIENT:}
